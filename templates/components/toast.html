{% if messages %}
  <div class="toast-container" id="toast-container">
    {% for message in messages %}
      <div class="toast toast-{{ message.tags }}">
        <span>{{ message }}</span>
        <button type="button" class="toast-close" onclick="this.parentElement.remove()">×</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
